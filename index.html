<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover : la page peut s'étendre sous les barres système d'un téléphone -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plateau d'histoire de l'ostéopathie</title>
<style>
/* =====================================================================
   1. JETONS DE DESIGN (couleurs, repris de la charte brun / cuivre / beige)
   ---------------------------------------------------------------------
   Tout passe par des variables CSS : le mode clair est le défaut, le mode
   sombre redéfinit les mêmes variables (deux fois : préférence système et
   attribut data-theme posé par l'hôte de la page).
   ===================================================================== */
:root {
  box-sizing: border-box;
  /* marges de sécurité pour les téléphones (valent 0 sur ordinateur) */
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);

  --paper: #F3EBDD;      /* fond de page : beige */
  --panel: #FBF6EC;      /* fond des panneaux */
  --ink: #3A281C;        /* texte : brun foncé */
  --ink-soft: #6B5644;   /* texte secondaire */
  --line: #9A7B5F;       /* traits et bordures */
  --btn-bg: #7C4414;     /* bouton principal : cuivre foncé */
  --btn-ink: #FFF8EE;
  --focus: #B06A2C;      /* anneau de focus et case active : cuivre */

  /* un fond par type de case (clair, économe en encre si on imprime) */
  --c-qui: #E8B99A;
  --c-ordre: #B8CDD6;
  --c-vf: #C5D5B0;
  --c-etape: #EBD28A;
  --c-duel: #E6BFC4;
  --c-rebond: #D4D0E0;
  --c-bord: var(--panel);  /* départ et arrivée */

  /* une couleur de bandeau par zone thématique */
  --z0: #8B4A2B;
  --z1: #2F6F73;
  --z2: #7D7A2F;
  --z3: #5E4B8B;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #241A14; --panel: #2E221A; --ink: #F0E4D3; --ink-soft: #C3AE98;
    --line: #8A6A4F; --btn-bg: #D18B4E; --btn-ink: #241A14; --focus: #D18B4E;
    --c-qui: #7A4B34; --c-ordre: #3F5560; --c-vf: #52633F; --c-etape: #7A6A2E;
    --c-duel: #7A4A52; --c-rebond: #55506A;
    --z0: #C9805A; --z1: #5FA8AC; --z2: #B4B15A; --z3: #9C88CF;
  }
}
:root[data-theme="dark"] {
  --paper: #241A14; --panel: #2E221A; --ink: #F0E4D3; --ink-soft: #C3AE98;
  --line: #8A6A4F; --btn-bg: #D18B4E; --btn-ink: #241A14; --focus: #D18B4E;
  --c-qui: #7A4B34; --c-ordre: #3F5560; --c-vf: #52633F; --c-etape: #7A6A2E;
  --c-duel: #7A4A52; --c-rebond: #55506A;
  --z0: #C9805A; --z1: #5FA8AC; --z2: #B4B15A; --z3: #9C88CF;
}

/* =====================================================================
   2. BASE
   ===================================================================== */
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0;
  background: var(--paper);          /* fond explicite, requis pour le thème */
  color: var(--ink);
  font-family: Arial, Helvetica, sans-serif;
  line-height: 1.45;
}
h1, h2, h3, p { margin: 0; }
h1 { font-size: 1.35rem; }
h2 { font-size: 1.15rem; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 12px 16px 28px; }
.sous { color: var(--ink-soft); font-size: .9rem; }

/* barre du haut */
.bar { display: flex; justify-content: space-between; align-items: center;
       gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.bar-droite { display: flex; align-items: center; gap: 12px; }
.chrono { font-weight: 700; font-variant-numeric: tabular-nums; }
.chrono.fini { color: var(--btn-bg); }

/* boutons */
.btn {
  font: inherit; font-weight: 700; cursor: pointer;
  padding: .6em 1.1em; border-radius: 8px;
  border: 2px solid var(--btn-bg); background: var(--btn-bg); color: var(--btn-ink);
}
.btn.sec { background: transparent; color: var(--ink); border-color: var(--line); }
.btn:focus-visible, input:focus-visible, select:focus-visible {
  outline: 3px solid var(--focus); outline-offset: 2px;
}
.rangee { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

/* panneaux */
.panel { background: var(--panel); border: 2px solid var(--line);
         border-radius: 10px; padding: 14px 16px; }

/* =====================================================================
   3. PLATEAU
   ---------------------------------------------------------------------
   Le plateau est une grille de 10 colonnes x 3 lignes. Chaque case et
   chaque pion est placé en pourcentage grâce aux variables --col et --row,
   ce qui garde le plateau net à toutes les tailles et permet d'animer le
   déplacement des pions avec une simple transition CSS.
   Les tailles de police utilisent cqw (1 % de la largeur du plateau).
   ===================================================================== */
.defile { overflow-x: auto; }               /* sur petit écran, le plateau défile seul */
.plateau {
  position: relative; width: 100%; min-width: 640px;
  aspect-ratio: 10 / 3;                     /* chaque case est un carré */
  container-type: inline-size;
}
.sq {
  position: absolute; width: 10%; height: 33.3333%;
  left: calc(var(--col) * 10%); top: calc(var(--row) * 33.3333%);
  padding: .3cqw;
}
.sq-in {
  position: relative; height: 100%; overflow: hidden;
  border: 2px solid var(--ink); border-radius: .8cqw;
  background: var(--fond);
  color: var(--ink);
}
.sq-num { position: absolute; top: .35cqw; left: .55cqw; font-size: 1.1cqw; font-weight: 700; }
.sq-sym { position: absolute; left: 0; right: 0; top: 15%; text-align: center;
          font-size: 1.9cqw; font-weight: 700; white-space: nowrap; }
.sq-bande { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: var(--zone); }
.sq.actif { z-index: 1; }
.sq.actif .sq-in { box-shadow: 0 0 0 .35cqw var(--focus); }

/* pions : une « place » (--slot) par équipe, pour que deux équipes
   sur la même case ne se recouvrent jamais */
.pion {
  position: absolute; z-index: 2; width: 2.1%; aspect-ratio: 1;
  left: calc(var(--col) * 10% + .5% + var(--slot) * 2.3%);
  top: calc(var(--row) * 33.3333% + 21%);
  display: flex; align-items: center; justify-content: center;
  border: 2px solid #FFF5E6; border-radius: 50%;
  color: #fff; font-weight: 700; font-size: 1.05cqw;
  transition: left .6s ease, top .6s ease;  /* le pion glisse vers sa nouvelle case */
}
.pion.courant { box-shadow: 0 0 0 2px var(--ink); }
@media (prefers-reduced-motion: reduce) { .pion { transition: none; } }

/* légende */
.legende { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 10px 0 14px;
           font-size: .85rem; color: var(--ink-soft); }
.leg { display: inline-flex; align-items: center; gap: 6px; }
.leg i { display: inline-block; min-width: 26px; padding: 1px 4px; text-align: center;
         font-style: normal; font-weight: 700; font-size: .75rem; color: var(--ink);
         border: 1.5px solid var(--ink); border-radius: 4px; background: var(--fond); }
.leg b { display: inline-block; width: 14px; height: 6px; background: var(--zone); }

/* =====================================================================
   4. ZONE DE JEU (carte en cours + équipes)
   ===================================================================== */
.bas { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 820px) { .bas { grid-template-columns: 1fr; } }

.tour-tete { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.badge { flex: none; display: inline-flex; align-items: center; justify-content: center;
         width: 34px; height: 34px; border-radius: 50%; border: 2px solid #FFF5E6;
         color: #fff; font-weight: 700; }
.puces { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.puce { font-size: .8rem; padding: 1px 8px; border: 1.5px solid var(--line); border-radius: 99px; }

.aide { color: var(--ink-soft); margin-bottom: 4px; }
.enonce { font-size: 1.2rem; font-weight: 700; max-width: 70ch; }
.consigne { color: var(--ink-soft); margin-bottom: 8px; }
.indices, .items, .ordre-exact { margin: 8px 0 0; padding-left: 1.4em; max-width: 70ch; }
.indices li, .items li, .ordre-exact li { margin: 5px 0; }
.items { list-style: upper-alpha; font-weight: 700; }
.reponse { margin-top: 12px; padding: 10px 12px; border-left: 5px solid var(--focus);
           background: var(--paper); max-width: 70ch; }
.note { color: var(--ink-soft); font-size: .92rem; margin-top: 4px; }
.resultat { font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; max-width: 70ch; }

/* équipes */
.equipe { display: grid; grid-template-columns: 34px 1fr; gap: 4px 10px; align-items: center;
          padding: 8px; border: 2px solid transparent; border-radius: 8px; }
.equipe + .equipe { margin-top: 6px; }
.equipe.courante { border-color: var(--focus); }
.equipe .nom { font-weight: 700; overflow-wrap: anywhere; }
.equipe .case { color: var(--ink-soft); font-size: .85rem; }
.progres { grid-column: 2; height: 6px; background: var(--paper); border-radius: 3px; overflow: hidden; }
.progres span { display: block; height: 100%; background: var(--equipe); }
.stats { margin-top: 10px; color: var(--ink-soft); font-size: .85rem; }

/* =====================================================================
   5. ACCUEIL ET BILAN
   ===================================================================== */
.accueil { max-width: 720px; margin: 24px auto; }
.accueil h1 { font-size: 1.7rem; margin-bottom: 4px; }
.regles { margin: 14px 0 18px; padding-left: 1.2em; }
.regles li { margin: 4px 0; }
.champs { display: grid; gap: 8px; margin-top: 10px; }
label { display: grid; gap: 3px; font-weight: 700; font-size: .9rem; }
input, select { font: inherit; padding: .45em .6em; border-radius: 6px;
                border: 2px solid var(--line); background: var(--paper); color: var(--ink); }
.ligne { display: flex; flex-wrap: wrap; gap: 16px; }
.ligne label { min-width: 180px; }

.voile { position: fixed; inset: 0; z-index: 10; overflow-y: auto;
         background: rgba(30, 20, 12, .6); padding: 20px 12px; }
.bilan { max-width: 640px; margin: 0 auto; }
.bilan ol.rang { padding-left: 1.3em; }
.bilan li { margin: 6px 0; }
.revoir li { margin: 10px 0; }
</style>
</head>

<script>
"use strict";

/* =====================================================================
   1. DONNÉES DU JEU
   ---------------------------------------------------------------------
   Tout ce qui change d'un cours à l'autre est regroupé ici : pour ajouter
   du contenu, il suffit de coller de nouveaux blocs dans CARTES, DUELS ou
   REBONDS. Le reste du code n'a pas besoin d'être modifié.
   Version 2 : cartes tirées des polycopiés CM2 à CM5. Chaque carte porte
   un champ "src" affiché au verso, pour retrouver le passage du cours.
   ===================================================================== */

// Les quatre zones du plateau, dans l'ordre du parcours.
// "couleur" renvoie à une variable CSS définie plus haut (--z0 à --z3).
const ZONES = [
  { id: "amerique",  nom: "Amérique",                 de: 1,  a: 7,  couleur: "var(--z0)" },
  { id: "europe",    nom: "Europe et monde",          de: 8,  a: 14, couleur: "var(--z1)" },
  { id: "therapies", nom: "Thérapies manuelles",      de: 15, a: 21, couleur: "var(--z2)" },
  { id: "concept",   nom: "Concept et lésion",        de: 22, a: 28, couleur: "var(--z3)" }
];

// Les six formats de case : libellé complet, symbole (jamais la couleur seule,
// pour rester lisible en noir et blanc ou pour un étudiant daltonien),
// et variable CSS de la couleur de fond.
const TYPES = {
  qui:    { label: "Qui suis-je ?",         sym: "?",     fond: "var(--c-qui)" },
  ordre:  { label: "Remettez dans l'ordre", sym: "1 2 3", fond: "var(--c-ordre)" },
  vf:     { label: "Vrai ou faux",          sym: "V/F",   fond: "var(--c-vf)" },
  etape:  { label: "Case étape",            sym: "★",     fond: "var(--c-etape)" },
  duel:   { label: "Duel",                  sym: "VS",    fond: "var(--c-duel)" },
  rebond: { label: "Rebondissement",        sym: "±",     fond: "var(--c-rebond)" },
  depart: { label: "Départ",                sym: "Départ", fond: "var(--c-bord)" },
  arrivee:{ label: "Arrivée",               sym: "Arrivée", fond: "var(--c-bord)" }
};

// Le plateau : une entrée par case, de 0 (départ) à 29 (arrivée).
// Les étapes ferment chaque zone (cases 7, 14, 21 et 28).
const PLATEAU = [
  "depart",
  "qui", "vf", "ordre", "qui", "rebond", "vf", "etape",      // 1 à 7   : Amérique
  "qui", "ordre", "vf", "duel", "qui", "vf", "etape",        // 8 à 14  : Europe et monde
  "vf", "qui", "rebond", "ordre", "qui", "vf", "etape",      // 15 à 21 : Thérapies manuelles
  "qui", "ordre", "duel", "vf", "rebond", "qui", "etape",    // 22 à 28 : Concept et lésion
  "arrivee"
];
const ARRIVEE = PLATEAU.length - 1;   // numéro de la dernière case (29)

// Nombre de cases gagnées selon le résultat. Modifiez ces valeurs pour
// rééquilibrer la longueur de la partie sans toucher au reste du code.
const GAINS = {
  qui:   [3, 2, 1],                                         // trouvé à l'indice 1, 2 ou 3
  vf:    { juste: 2, justeSansArgument: 1, faux: 0 },
  ordre: { exact: 3, inversion: 2, partiel: 1, rate: 0 },
  etape: { exact: 4, inversion: 3, partiel: 2, rate: 1 },   // une étape fait toujours avancer d'au moins 1
  duel:  2

// Les cartes par zone. Pour ajouter une carte, copiez un bloc existant.
//  - qui    : 3 indices de plus en plus précis, la réponse, une note facultative
//  - vf     : un énoncé, vrai (true/false), une explication
//  - ordre / etape : des événements DÉJÀ DANS LE BON ORDRE (le jeu les mélange).
//                    "y" est l'étiquette de date affichée à la correction.
//  - src    : cours d'origine, affiché au verso pour vérifier la carte
// Les cartes viennent des polycopiés CM1 à CM5.
// Les faits que la liste de corrections signale comme douteux n'y figurent pas.
const CARTES = {

     ZONE 1 : AMÉRIQUE (CM1 pour les débuts, CM3 / CM4 / CM5 pour le reste)
     ================================================================== */

    qui: [
      { indices: ["J'ai servi comme médecin militaire dans l'armée de l'Union pendant la guerre de Sécession.",
                  "Insatisfait de la médecine de mon époque, je cherche une approche centrée sur le corps et ses capacités d'autorégulation.",
                  "En 1874, je déclare avoir fondé une nouvelle approche que j'appellerai ostéopathie."],

        note: "Avant cela, il s'est aussi fait appeler « magnetic healer », « human engineer » ou « lightning bonesetter ».", src: "CM1" },

                  "En 1892, on y a ouvert la première école d'ostéopathie.",

                  "Mes animaux d'expérimentation étaient des lapins.",

        reponse: "Edythe Ashmore", src: "CM1" },
      { indices: ["Ostéopathe afro-américain, j'ai été diplômé de l'école de Des Moines.",
                  "J'ai défendu les droits civiques aux côtés de Martin Luther King.",
                  "J'ai présidé l'AOA en 1994, et un programme d'aide financière aux étudiants issus des minorités porte mon nom."],
        reponse: "William G. Anderson", src: "CM1" },
      { indices: ["Je suis une ostéopathe spécialisée en pédiatrie.",

        explication: "Mais il n'est pas sûr que ce soient les seules : les journaux de l'époque font la publicité d'autres écoles.", src: "CM1" },

const app = document.getElementById("app");

// Protège le texte saisi par l'utilisateur (noms d'équipes) avant de l'insérer en HTML.
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// Mélange de Fisher-Yates : renvoie une COPIE mélangée du tableau.
function melanger(tab) {
  const a = tab.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Accord simple « 1 case / 2 cases ».
const pl = (n, mot) => `${n} ${mot}${Math.abs(n) > 1 ? "s" : ""}`;

// Index (0 à 3) de la zone d'une case.
function zoneDe(i) {
  if (i <= 7) return 0;
  if (i <= 14) return 1;
  if (i <= 21) return 2;
  return 3;
}

// Format de la question posée à une équipe qui se trouve sur la case i.
// Au départ, on pose un « Qui suis-je ? » de la première zone.
function typeDeCase(i) {
  return i === 0 ? "qui" : PLATEAU[i];
}

// Position (colonne, ligne) d'une case sur le plateau en serpentin :
// ligne 0 de gauche à droite, ligne 1 de droite à gauche, ligne 2 de gauche à droite.
function posPlateau(i) {
  const row = Math.floor(i / 10);
  const col = row % 2 === 0 ? i % 10 : 9 - (i % 10);
  return { col, row };
}

/* =====================================================================
   4. PIOCHES
   ---------------------------------------------------------------------
   Une pioche par couple (type, zone). On tire sans remise : une carte déjà
   jouée ne revient qu'une fois toutes les autres épuisées (la pioche est
   alors remélangée).
   ===================================================================== */
function piocher(type, zoneId) {
  // la source de cartes dépend du type
  let source;
  if (type === "duel") source = DUELS;
  else if (type === "rebond") source = REBONDS;
  else source = CARTES[zoneId][type];

  const cle = type + ":" + (type === "duel" || type === "rebond" ? "" : zoneId);
  if (!etat.pioches[cle] || etat.pioches[cle].length === 0) {
    etat.pioches[cle] = melanger(source.map((_, k) => k));   // (re)mélange les index
  }
  return source[etat.pioches[cle].pop()];
}

function demarrerPartie() {
  const noms = [...document.querySelectorAll("#champs input")]
    .map((inp, k) => inp.value.trim() || "Équipe " + (k + 1));
  const minutes = Math.max(0, parseInt($("duree").value, 10) || 0);

  etat = {
    equipes: noms.map((nom, k) => ({ nom, pos: 0, couleur: COULEURS[k] })),
    courante: 0,            // index de l'équipe qui joue
    pioches: {},            // cartes restantes (voir piocher)
    aRevoir: [],            // cartes ratées, pour le débrief
    cartesJouees: 0,
    fini: false,            // vrai dès qu'une équipe atteint l'arrivée
    finChrono: minutes > 0 ? Date.now() + minutes * 60000 : null,
    tour: { phase: "attente" }
  };

  construirePartie();
  majTout();
  lancerChrono();
}

// Construit une seule fois le squelette de l'écran de jeu (plateau, légende, panneaux).
// Les mises à jour ultérieures ne modifient que ce qui change, afin que les
// pions puissent glisser d'une case à l'autre.
function construirePartie() {
  // 30 cases, positionnées en pourcentage grâce à --col et --row
  const cases = PLATEAU.map((type, i) => {
    const { col, row } = posPlateau(i);
    const t = TYPES[type];
    const zone = ZONES[zoneDe(i)];
    const numero = (type === "depart" || type === "arrivee") ? "" : `<span class="sq-num">${i}</span>`;
    return `<div class="sq" id="sq-${i}" style="--col:${col};--row:${row}"
                 role="img" aria-label="Case ${i}, ${t.label}, zone ${zone.nom}">
      <div class="sq-in" style="--fond:${t.fond};--zone:${zone.couleur}">
        ${numero}
        <span class="sq-sym" ${t.sym.length > 4 ? 'style="font-size:1.35cqw;top:28%"' : ""}>${t.sym}</span>
        <span class="sq-bande"></span>
      </div>
    </div>`;
  }).join("");

  // un pion par équipe, avec sa « place » (--slot) fixe sur la case
  const pions = etat.equipes.map((eq, k) =>
    `<div class="pion" id="pion-${k}" style="--slot:${k};background:${eq.couleur}"
          title="${esc(eq.nom)}">${k + 1}</div>`).join("");

  // légende : formats de case + zones
  const legTypes = ["qui", "ordre", "vf", "etape", "duel", "rebond"].map((k) =>
    `<span class="leg"><i style="--fond:${TYPES[k].fond}">${TYPES[k].sym}</i>${TYPES[k].label}</span>`).join("");
  const legZones = ZONES.map((z) =>
    `<span class="leg"><b style="--zone:${z.couleur}"></b>${z.nom} (cases ${z.de} à ${z.a})</span>`).join("");

  app.innerHTML = `
  <div class="wrap">
    <header class="bar">
      <div>
        <h1>Plateau d'histoire de l'ostéopathie</h1>
        <p class="sous">Cartes des polycopiés CM2 à CM5</p>
      </div>
      <div class="bar-droite">
        <span id="chrono" class="chrono"></span>
        <button class="btn sec" data-act="bilan">Terminer la partie</button>
      </div>
    </header>
    <div class="defile"><div class="plateau" id="plateau">${cases}${pions}</div></div>
    <div class="legende">${legTypes}${legZones}</div>
    <div class="bas">
      <section class="panel" id="tour" aria-live="polite"></section>
      <aside class="panel" id="equipes"></aside>
    </div>
  </div>`;
}

function majTout() {
  majPions();
  majEquipes();
  majTour();
}

    p.style.setProperty("--col", col);
    p.style.setProperty("--row", row);
    p.classList.toggle("courant", k === etat.courante);
  });
  // la case de l'équipe courante est entourée
  document.querySelectorAll(".sq.actif").forEach((s) => s.classList.remove("actif"));
  $("sq-" + etat.equipes[etat.courante].pos).classList.add("actif");
}

// Liste des équipes avec leur avancement.
function majEquipes() {
  $("equipes").innerHTML = "<h2>Équipes</h2>" +
    etat.equipes.map((eq, k) => `
      <div class="equipe ${k === etat.courante ? "courante" : ""}" style="--equipe:${eq.couleur}">
        <span class="badge" style="background:${eq.couleur}">${k + 1}</span>
        <div><div class="nom">${esc(eq.nom)}</div>
             <div class="case">Case ${eq.pos} sur ${ARRIVEE}</div></div>
        <div class="progres"><span style="width:${(eq.pos / ARRIVEE) * 100}%"></span></div>
      </div>`).join("") +
    `<p class="stats">Cartes jouées : ${etat.cartesJouees}</p>`;
}

// Panneau central : change selon la phase du tour (attente, carte, résultat).
function majTour() {
  const t = etat.tour;
  const eq = etat.equipes[etat.courante];
  const type = typeDeCase(eq.pos);
  const zone = ZONES[zoneDe(eq.pos)];
  const badge = `<span class="badge" style="background:${eq.couleur}">${etat.courante + 1}</span>`;

  let html;
  if (t.phase === "attente") {
    html = `<div class="tour-tete">${badge}<div><h2>Au tour de ${esc(eq.nom)}</h2>
      <div class="puces"><span class="puce">Case ${eq.pos}</span><span class="puce">${zone.nom}</span>
      <span class="puce">${TYPES[type].label}</span></div></div></div>
      <p class="aide">Lisez la carte à voix haute, l'équipe répond, puis on valide ici.</p>
      <div class="rangee"><button class="btn" data-act="tirer">Tirer une carte</button></div>`;
  } else if (t.phase === "carte") {
    html = `<div class="tour-tete">${badge}<div><h2>${esc(eq.nom)}</h2>
      <div class="puces"><span class="puce">Case ${eq.pos}</span><span class="puce">${t.zone.nom}</span>
      <span class="puce">${TYPES[t.type].label}</span></div></div></div>` + htmlCarte(t);
  } else {
    html = `<div class="tour-tete">${badge}<h2>Résultat</h2></div>
      <p class="resultat">${esc(t.texte)}</p>
      <div class="rangee"><button class="btn" data-act="${etat.fini ? "bilan" : "suivant"}">
        ${etat.fini ? "Voir le bilan" : "Équipe suivante"}</button></div>`;
  }
  $("tour").innerHTML = html;
}

/* =====================================================================
   8. CONTENU DES CARTES (un bloc HTML par format)
   ===================================================================== */
// Ligne « Source » affichée au verso d'une carte (cours d'origine),
// pour que l'enseignant retrouve le passage du polycopié.
function htmlSrc(c) {
  return c.src ? `<div class="note">Source : ${esc(c.src)}</div>` : "";
}

function htmlCarte(t) {
  if (t.type === "qui") return htmlQui(t);
  if (t.type === "vf") return htmlVF(t);
  if (t.type === "ordre" || t.type === "etape") return htmlOrdre(t);
  if (t.type === "duel") return htmlDuel(t);
  return htmlRebond(t);
}

// Qui suis-je ? : les indices se dévoilent un par un.
function htmlQui(t) {
  const c = t.data, n = t.indicesVus;
  let h = `<p class="consigne">Qui suis-je ? Indice${n > 1 ? "s" : ""} dévoilé${n > 1 ? "s" : ""} : ${n} sur ${c.indices.length}</p>
    <ol class="indices">${c.indices.slice(0, n).map((x) => `<li>${esc(x)}</li>`).join("")}</ol>`;
  if (!t.vue) {
    h += `<div class="rangee">
      ${n < c.indices.length ? `<button class="btn sec" data-act="indice">Indice suivant</button>` : ""}
      <button class="btn" data-act="voir">Voir la réponse</button></div>`;
  } else {
    h += `<div class="reponse">Réponse : <strong>${esc(c.reponse)}</strong>
      ${c.note ? `<div class="note">${esc(c.note)}</div>` : ""}${htmlSrc(c)}</div>
      <div class="rangee">
        <button class="btn" data-act="qui" data-arg="trouve">Trouvé avec ${pl(n, "indice")} (+${GAINS.qui[n - 1]})</button>
        <button class="btn sec" data-act="qui" data-arg="rate">Pas trouvé (0)</button></div>`;
  }
  return h;
}

// Vrai ou faux : la justification compte.
function htmlVF(t) {
  const c = t.data;
  let h = `<p class="consigne">Vrai ou faux ? L'équipe répond et justifie.</p>
    <p class="enonce">« ${esc(c.enonce)} »</p>`;
  if (!t.vue) {
    h += `<div class="rangee"><button class="btn" data-act="voir">Voir la réponse</button></div>`;
  } else {
    h += `<div class="reponse"><strong>${c.vrai ? "Vrai" : "Faux"}.</strong> ${esc(c.explication)}${htmlSrc(c)}</div>
      <div class="rangee">
        <button class="btn" data-act="vf" data-arg="juste">Bonne réponse et bon argument (+${GAINS.vf.juste})</button>
        <button class="btn sec" data-act="vf" data-arg="justeSansArgument">Bonne réponse sans argument (+${GAINS.vf.justeSansArgument})</button>
        <button class="btn sec" data-act="vf" data-arg="faux">Mauvaise réponse (0)</button></div>`;
  }
  return h;
}

// Remettez dans l'ordre (et case étape, qui utilise le même format avec 5 événements).
function htmlOrdre(t) {
  const c = t.data;
  const g = GAINS[t.type];
  let h = `<p class="consigne">${esc(c.consigne || "Remettez ces événements dans l'ordre chronologique.")}</p>
    <ol class="items">${t.melange.map((k) => `<li>${esc(c.items[k].t)}</li>`).join("")}</ol>`;
  if (!t.vue) {
    h += `<div class="rangee"><button class="btn" data-act="voir">Voir l'ordre exact</button></div>`;
  } else {
    h += `<div class="reponse"><strong>Ordre exact</strong>
      <ol class="ordre-exact">${c.items.map((it) => `<li><strong>${esc(it.y)}</strong> : ${esc(it.t)}</li>`).join("")}</ol>${htmlSrc(c)}</div>
      <div class="rangee">
        <button class="btn" data-act="ordre" data-arg="exact">Ordre exact (+${g.exact})</button>
        <button class="btn sec" data-act="ordre" data-arg="inversion">Une inversion (+${g.inversion})</button>
        <button class="btn sec" data-act="ordre" data-arg="partiel">Partiellement juste (+${g.partiel})</button>
        <button class="btn sec" data-act="ordre" data-arg="rate">Raté (+${g.rate})</button></div>`;
  }
  return h;
}

// Duel : on choisit d'abord l'adversaire, puis on désigne le vainqueur.
function htmlDuel(t) {
  const actif = etat.courante;
  if (t.adversaire === null) {
    return `<p class="consigne">Duel : choisissez l'équipe adverse. La plus rapide et exacte gagne ${pl(GAINS.duel, "case")}.</p>
      <div class="rangee">${etat.equipes.map((eq, k) => k === actif ? "" :
        `<button class="btn sec" data-act="adversaire" data-arg="${k}">Défier ${esc(eq.nom)}</button>`).join("")}</div>`;
  }
  const adv = etat.equipes[t.adversaire];
  let h = `<p class="consigne">${esc(etat.equipes[actif].nom)} contre ${esc(adv.nom)}</p>
    <p class="enonce">${esc(t.data.question)}</p>`;
  if (!t.vue) {
    h += `<div class="rangee"><button class="btn" data-act="voir">Voir la réponse</button></div>`;
  } else {
    h += `<div class="reponse">Réponse : <strong>${esc(t.data.reponse)}</strong>${htmlSrc(t.data)}</div>
      <div class="rangee">
        <button class="btn" data-act="gagnant" data-arg="${actif}">Point pour ${esc(etat.equipes[actif].nom)}</button>
        <button class="btn" data-act="gagnant" data-arg="${t.adversaire}">Point pour ${esc(adv.nom)}</button>
        <button class="btn sec" data-act="gagnant" data-arg="aucun">Personne</button></div>`;
  }
  return h;
}

// Rebondissement : on lit la carte puis on l'applique.
function htmlRebond(t) {
  return `<p class="enonce">${esc(t.data.texte)}</p>
    <div class="rangee"><button class="btn" data-act="rebond">Appliquer</button></div>`;
}

/* =====================================================================
   9. DÉROULEMENT D'UN TOUR
   ===================================================================== */

// Tire la carte qui correspond à la case de l'équipe courante.
function tirerCarte() {
  const eq = etat.equipes[etat.courante];
  const type = typeDeCase(eq.pos);
  const zone = ZONES[zoneDe(eq.pos)];
  const t = { phase: "carte", type, zone, data: piocher(type, zone.id),
              indicesVus: 1, vue: false, adversaire: null };
  // pour les formats « ordre », on mélange les événements (jamais dans le bon ordre)
  if (type === "ordre" || type === "etape") {
    const n = t.data.items.length;
    let m;
    do { m = melanger([...Array(n).keys()]); } while (m.every((v, i) => v === i));
    t.melange = m;
  }
  etat.cartesJouees++;
  etat.tour = t;
  majTour();
}

// Déplace une équipe et renvoie la phrase qui décrit le déplacement.
// Règle : en avançant, on s'arrête sur la première case étape rencontrée.
function deplacer(eq, delta) {
  const avant = eq.pos;
  let apres = avant;
  let bloque = false;
  if (delta > 0) {
    for (let k = 1; k <= delta; k++) {
      apres = avant + k;
      if (apres >= ARRIVEE) { apres = ARRIVEE; break; }
      if (PLATEAU[apres] === "etape") { bloque = k < delta; break; }
    }
  } else if (delta < 0) {
    apres = Math.max(0, avant + delta);
  }
  eq.pos = apres;
  const reel = apres - avant;

  if (reel === 0) return `${eq.nom} reste sur la case ${avant}.`;
  if (reel > 0) {
    let s = `${eq.nom} avance de ${pl(reel, "case")} (case ${apres}).`;
    if (bloque) s += " Une case étape ne se dépasse qu'après l'avoir jouée.";
    if (apres === ARRIVEE) s += " Arrivée atteinte !";
    return s;
  }
  return `${eq.nom} recule de ${pl(-reel, "case")} (case ${apres}).`;
}

// Termine le tour : applique les déplacements, note la carte à revoir si besoin,
// et passe à la phase « résultat ».
function conclure(deplacements, introduction, aRevoir) {
  const phrases = [introduction];
  deplacements.forEach((d) => phrases.push(deplacer(d.equipe, d.delta)));
  if (aRevoir) {
    const deja = etat.aRevoir.some((x) => x.titre === aRevoir.titre);
    if (!deja) etat.aRevoir.push(aRevoir);
  }
  if (etat.equipes.some((e) => e.pos >= ARRIVEE)) etat.fini = true;
  etat.tour = { phase: "resultat", texte: phrases.filter(Boolean).join(" ") };
  majTout();
}

// Passe à l'équipe suivante.
function equipeSuivante() {
  etat.courante = (etat.courante + 1) % etat.equipes.length;
  etat.tour = { phase: "attente" };
  majTout();
}

// Point d'entrée unique de tous les clics (boutons avec data-act et data-arg).
function agir(act, arg) {
  const t = etat && etat.tour;
  const eq = etat && etat.equipes[etat.courante];

  switch (act) {
    case "lancer":    demarrerPartie(); break;
    case "tirer":     tirerCarte(); break;
    case "indice":    t.indicesVus++; majTour(); break;
    case "voir":      t.vue = true; majTour(); break;
    case "suivant":   equipeSuivante(); break;
    case "bilan":     ouvrirBilan(); break;
    case "reprendre": document.getElementById("bilan").remove(); break;
    case "nouvelle":  afficherAccueil(); break;

    // Qui suis-je ? : gain selon le nombre d'indices utilisés
    case "qui": {
      const c = t.data;
      if (arg === "trouve") {
        conclure([{ equipe: eq, delta: GAINS.qui[t.indicesVus - 1] }],
                 `${eq.nom} a trouvé avec ${pl(t.indicesVus, "indice")}.`);
      } else {
        conclure([{ equipe: eq, delta: 0 }], `Pas trouvé : c'était ${c.reponse}.`,
                 { zone: t.zone.nom, titre: "Qui suis-je ? " + c.reponse, reponse: c.reponse });
      }
      break;
    }
    // Vrai ou faux
    case "vf": {
      const c = t.data;
      const miss = arg === "faux" || arg === "justeSansArgument";
      conclure([{ equipe: eq, delta: GAINS.vf[arg] }], "",
               miss ? { zone: t.zone.nom, titre: c.enonce,
                        reponse: (c.vrai ? "Vrai. " : "Faux. ") + c.explication } : null);
      break;
    }
    // Ordre et étape
    case "ordre": {
      const c = t.data;
      const miss = arg === "partiel" || arg === "rate";
      conclure([{ equipe: eq, delta: GAINS[t.type][arg] }], "",
               miss ? { zone: t.zone.nom, titre: (c.consigne || "Remettre dans l'ordre") + " : " + c.items[0].t + "...",
                        reponse: c.items.map((it) => it.y + " " + it.t).join(" ; ") } : null);
      break;
    }
    // Duel : choix de l'adversaire puis du vainqueur
    case "adversaire": t.adversaire = +arg; majTour(); break;
    case "gagnant": {
      if (arg === "aucun") {
        conclure([], "Personne n'a trouvé : le duel ne rapporte rien.");
      } else {
        const gagnant = etat.equipes[+arg];
        conclure([{ equipe: gagnant, delta: GAINS.duel }], `${gagnant.nom} remporte le duel.`);
      }
      break;
    }
    // Rebondissement
    case "rebond":
      conclure([{ equipe: eq, delta: t.data.delta }], "");
      break;
  }
}

/* =====================================================================
   10. CHRONOMÈTRE
   ===================================================================== */
function lancerChrono() {
  arreterChrono();
  majChrono();
  minuteur = setInterval(majChrono, 1000);
}
function arreterChrono() {
  if (minuteur) { clearInterval(minuteur); minuteur = null; }
}
function majChrono() {
  const el = $("chrono");
  if (!el || !etat) return;
  if (!etat.finChrono) { el.textContent = ""; return; }
  const reste = Math.max(0, Math.round((etat.finChrono - Date.now()) / 1000));
  if (reste === 0) {
    el.textContent = "Temps écoulé : terminez le tour";
    el.classList.add("fini");
  } else {
    const m = String(Math.floor(reste / 60)).padStart(2, "0");
    const s = String(reste % 60).padStart(2, "0");
    el.textContent = `Temps restant ${m}:${s}`;
  }
}

/* =====================================================================
   11. BILAN DE FIN DE PARTIE
   ---------------------------------------------------------------------
   Classement, puis liste des cartes ratées : c'est la matière du débrief
   à rejouer collectivement.
   ===================================================================== */
function ouvrirBilan() {
  if (document.getElementById("bilan")) return;
  const classement = etat.equipes.slice().sort((a, b) => b.pos - a.pos);
  const ex = classement.length > 1 && classement[0].pos === classement[1].pos;

  const revoir = etat.aRevoir.length
    ? `<h2 style="margin-top:16px">Cartes à revoir en débrief</h2>
       <ul class="revoir">${etat.aRevoir.map((x) =>
         `<li><strong>${esc(x.zone)}</strong> : ${esc(x.titre)}<div class="note">${esc(x.reponse)}</div></li>`).join("")}</ul>`
    : `<p class="note" style="margin-top:12px">Aucune carte ratée pour l'instant.</p>`;

  const div = document.createElement("div");
  div.className = "voile";
  div.id = "bilan";
  div.innerHTML = `<div class="panel bilan">
    <h1>Bilan de la partie</h1>
    <p class="sous">${ex ? "Égalité en tête : à départager en débrief." : esc(classement[0].nom) + " est en tête."}</p>
    <ol class="rang">${classement.map((e) => `<li><strong>${esc(e.nom)}</strong>, case ${e.pos} sur ${ARRIVEE}</li>`).join("")}</ol>
    ${revoir}
    <div class="rangee">
      <button class="btn sec" data-act="reprendre">Reprendre la partie</button>
      <button class="btn" data-act="nouvelle">Nouvelle partie</button>
    </div></div>`;
  document.body.appendChild(div);
}

/* =====================================================================
   12. DÉMARRAGE
   ===================================================================== */
// Un seul écouteur pour tous les boutons de la page (délégation d'événements).
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]");
  if (b) agir(b.dataset.act, b.dataset.arg);
});
afficherAccueil();
</script>
